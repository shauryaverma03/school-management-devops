name: Build test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_DB: school_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U school" --health-interval=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest -q
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://school:ci-only-test-password@localhost/school_test
        run: pytest -q
      - run: pip-audit -r requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: kubectl kustomize k8s > /tmp/school-manifest.yaml
      - name: Compose integration and recovery
        run: bash scripts/ci-compose.sh
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > /tmp/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: /tmp/compose.log
      - if: always()
        run: docker compose down -v

  kubernetes:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - uses: helm/kind-action@v1
        with:
          cluster_name: school-ci
      - run: docker build --build-arg APP_VERSION="${{ github.sha }}" -t school-api:local .
      - run: kind load docker-image school-api:local --name school-ci
      - run: python scripts/init-env.py
      - run: IMAGE=school-api:local sh scripts/deploy-k8s.sh
      - name: Exercise service
        run: |
          set -a
          source .env
          set +a
          kubectl -n school port-forward svc/school-api 8000:8000 >/tmp/forward.log 2>&1 &
          trap 'kill $! || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8000/ready; then break; fi
            sleep 2
          done
          BASE_URL=http://localhost:8000 python scripts/smoke.py
      - name: Verify pod replacement
        run: |
          pod=$(kubectl -n school get pod -l app=school-api -o jsonpath='{.items[0].metadata.name}')
          kubectl -n school delete pod "$pod"
          kubectl -n school rollout status deployment/school-api --timeout=180s
      - if: always()
        run: kubectl -n school get pods,pvc,svc

  publish:
    needs: [verify, kubernetes]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Record release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image %s@%s\nCommit %s\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: released-image
          path: image.txt

  deploy:
    needs: publish
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy immutable image via Systems Manager
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: python3 scripts/deploy-ssm.py
